# docker/nginx/nginx.conf — production reverse proxy / gateway
#
# Mirrors webpack.config.js's devServer.proxy route table (dev-only,
# webpack-dev-server, absent from any production build) as a real,
# always-on gateway in front of every collaboration/render/voice
# WebSocket and HTTP route this app exposes. TLS-terminates here; every
# backend service is reached over the internal Docker network, never
# exposed on its own host port directly (see docker-compose.prod.yml).
#
# What this gateway does NOT front:
#   - The LiveKit SFU media path (__LIVEKIT_URL__, wss://) — WebRTC/ICE
#     media cannot be proxied through a plain L7 reverse proxy; it needs
#     its own TLS + TURN-reachable endpoint. Only the token-issuing HTTP
#     route (/livekit-token) is fronted here, matching the existing
#     comment in webpack.config.js's devServer.proxy block.
#
# Route table (must stay in sync with webpack.config.js's proxy block):
#   /api            -> api:3001            (HTTP)
#   /app-ws         -> api:3001/ws         (WebSocket)
#   /yjs-ws         -> yjs:9001            (WebSocket)
#   /render-ws      -> render-server:7000/ws  (WebSocket)
#   /render-api     -> render-server:7000  (HTTP)
#   /livekit-token  -> token-server:3002   (HTTP)
#   /               -> frontend static build (dist/)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;

  # Standard WebSocket upgrade plumbing, shared by every WS location below.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api_upstream          { server api:3001; }
  upstream yjs_upstream          { server yjs:9001; }
  upstream render_upstream       { server render-server:7000; }
  upstream token_server_upstream { server token-server:3002; }

  server {
    listen 80;
    server_name _;
    # Plain HTTP redirects to HTTPS — everything else is served over TLS.
    # ACME / Let's Encrypt HTTP-01 challenges should be exempted from this
    # redirect if you wire up automated certificate issuance; add a
    # `location /.well-known/acme-challenge/ { ... }` block above this
    # return if so.
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # Provided by the `gateway` service's volume mount in
    # docker-compose.prod.yml — see that file and docs/production-gateway.md
    # for how to supply real certificates (this repo ships none).
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 100m; # dataset uploads go through /api/files

    # ── Main API (REST) ──────────────────────────────────────────────────
    location /api {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Live broadcast WebSocket (annotations, view/camera state) ───────
    # Mounted at /app-ws (not /ws) on the frontend side because
    # webpack-dev-server's own HMR socket owns /ws in dev — kept the same
    # path here for parity with the dev proxy table. The backend's real
    # WebSocketServer listens at /ws, hence the rewrite.
    location /app-ws {
      proxy_pass http://api_upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s; # long-lived WS connections
    }

    # ── Y.js collaboration WebSocket ─────────────────────────────────────
    location /yjs-ws/ {
      proxy_pass http://yjs_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # ── Render server WebSocket (interactive frame streaming) ───────────
    location /render-ws {
      proxy_pass http://render_upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # ── Render server HTTP (dataset listing, one-shot load/camera/frame) ─
    location /render-api/ {
      proxy_pass http://render_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── LiveKit token issuance (media itself is NOT proxied — see header) ─
    location /livekit-token/ {
      proxy_pass http://token_server_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend static build ─────────────────────────────────────────────
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html; # SPA fallback, mirrors devServer's historyApiFallback
    }
  }
}
